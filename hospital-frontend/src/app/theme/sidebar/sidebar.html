@if (showHeader()) {
  <div class="matero-sidebar-header">
    <mat-toolbar>
      <span class="flex-fill"></span>

      @if (showToggle()) {
        <button
          mat-icon-button
          type="button"
          [attr.aria-label]="toggleChecked() ? 'Expand sidebar' : 'Collapse sidebar'"
          [matTooltip]="toggleChecked() ? 'Expand sidebar' : 'Collapse sidebar'"
          matTooltipPosition="right"
          (click)="toggleCollapsed.emit()"
        >
          <mat-icon>{{ toggleChecked() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        </button>
      } @else {
        <button
          mat-icon-button
          type="button"
          aria-label="Close navigation menu"
          (click)="closeSidenav.emit()"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-toolbar>
  </div>
}

<div class="matero-sidebar-main">
  @if (showUser()) {
    <app-user-panel />
  }
  <app-sidemenu />
</div>
