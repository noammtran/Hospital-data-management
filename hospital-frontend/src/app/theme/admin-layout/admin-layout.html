<div
  class="matero-container-wrap matero-navbar-side matero-header-fixed"
  [class.matero-sidenav-collapsed]="!isOver && collapsed()"
  [class.matero-over]="isOver"
  dir="ltr"
>
  <ng-progress ngProgressRouter />

  <mat-sidenav-container class="matero-container" autoFocus>
    <mat-sidenav
      #sidenav
      id="main-sidebar"
      class="matero-sidenav"
      [mode]="isOver ? 'over' : 'side'"
      [opened]="!isOver || mobileSidenavOpened()"
      (openedChange)="onSidenavOpenedChange($event)"
    >
      <app-sidebar
        [showToggle]="!isOver"
        (toggleCollapsed)="toggleCollapsed()"
        [toggleChecked]="collapsed()"
        (closeSidenav)="sidenav.close()"
      />
    </mat-sidenav>

    <mat-sidenav #sidenavNotice position="end" mode="over">
      <app-sidebar-notice />
    </mat-sidenav>

    <mat-sidenav-content #content class="matero-content">
      @if (isOver) {
        <div class="matero-mobile-navigation">
          <button
            mat-button
            type="button"
            aria-label="Open navigation menu"
            aria-controls="main-sidebar"
            [attr.aria-expanded]="mobileSidenavOpened()"
            (click)="mobileSidenavOpened.set(true)"
          >
            <mat-icon>menu</mat-icon>
            Menu
          </button>
        </div>
      }
      <main class="matero-page-content">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
