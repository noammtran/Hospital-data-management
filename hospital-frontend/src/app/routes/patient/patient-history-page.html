<mat-card>
  <mat-card-content>
    <mtx-grid
      [data]="items()"
      [columns]="columns"
      [length]="total()"
      [loading]="loading()"
      [pageOnFront]="false"
      [pageIndex]="page - 1"
      [pageSize]="size"
      [pageSizeOptions]="[10, 20, 50]"
      [showColumnMenuButton]="false"
      [rowHover]="true"
      [noResultText]="'No changes recorded yet'"
      (page)="onPage($event)"
    />
  </mat-card-content>
</mat-card>
