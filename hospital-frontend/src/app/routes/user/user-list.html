<header class="user-page-header">
  <h1>Staff accounts</h1>
  <p>Manage employee access, roles, account status, and password recovery.</p>
</header>

<mat-card>
  <mat-card-content>
    <form class="row user-filters" [formGroup]="filterForm">
      <div class="col-sm-6 col-md-4">
        <mat-form-field class="w-full">
          <mat-label>Search accounts</mat-label>
          <input matInput formControlName="search" placeholder="Identity number, name, or email" />
          <mat-icon matIconSuffix>search</mat-icon>
        </mat-form-field>
      </div>
      <div class="col-sm-3 col-md-2">
        <mat-form-field class="w-full">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option [value]="null">All roles</mat-option>
            @for (option of roleOptions; track option.value) {
              <mat-option [value]="option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-sm-3 col-md-2">
        <mat-form-field class="w-full">
          <mat-label>Status</mat-label>
          <mat-select formControlName="active">
            <mat-option [value]="null">All statuses</mat-option>
            <mat-option [value]="true">Active</mat-option>
            <mat-option [value]="false">Locked</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-sm-12 col-md-4 filter-actions">
        <button mat-button type="button" (click)="clearFilters()">Clear filters</button>
      </div>
    </form>

    <div class="d-flex align-items-center m-b-16">
      <button mat-flat-button color="primary" type="button" (click)="openCreate()">
        <mat-icon>person_add</mat-icon>
        Add staff account
      </button>
    </div>

    <mtx-grid
      [data]="users()"
      [columns]="columns"
      [length]="total()"
      [loading]="loading()"
      [pageOnFront]="false"
      [pageIndex]="page - 1"
      [pageSize]="size"
      [pageSizeOptions]="[10, 20, 50]"
      [showColumnMenuButton]="false"
      [rowHover]="true"
      [noResultText]="'No staff accounts found'"
      (page)="onPage($event)"
    />
  </mat-card-content>
</mat-card>
